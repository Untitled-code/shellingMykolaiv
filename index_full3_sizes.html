<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Миколаївщина під обстрілами</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.12.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.12.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<style>
  .map-overlay {
    font: 12px/20px 'Helvetica Neue', Arial, Helvetica, sans-serif;
    position: absolute;
    width: 25%;
    top: 0;
    left: 0;
    padding: 10px;
  }

  .map-overlay .map-overlay-inner {
    background-color: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    border-radius: 3px;
    padding: 10px;
    margin-bottom: 10px;
  }

  .map-overlay h2 {
    line-height: 24px;
    display: block;
    margin: 0 0 10px;
  }

  .map-overlay .legend .bar {
    height: 10px;
    width: 100%;
    background: linear-gradient(to right, #fca107, #7f3121);
  }

  .map-overlay input {
    background-color: transparent;
    display: inline-block;
    width: 100%;
    position: relative;
    margin: 0;
    cursor: ew-resize;
  }
</style>

<div id="map"></div>

<div class="map-overlay top">
  <div class="map-overlay-inner">
    <h2>Як обстрілювали Миколаївську область у 2022 році</h2>
    <label id="month"></label>
    <input id="slider" type="range" min="0" max="11" step="1" value="0">
  </div>
  <div class="map-overlay-inner">
    <div id="legend" class="legend">
      <div class="bar"></div>
      <div>Інтенсивність обстрілів</div>
    </div>
  </div>
</div>

<script src="https://d3js.org/d3.v3.min.js" charset="utf-8"></script>
<script>
  // TO MAKE THE MAP APPEAR YOU MUST
  // ADD YOUR ACCESS TOKEN FROM
  // https://account.mapbox.com
  mapboxgl.accessToken = 'pk.eyJ1Ijoib2tvcnNhY2giLCJhIjoiY2xjbmc1bm1xMGNjNDN3bXJmNTZ3OGFjdyJ9.MF70WZV3iMroc85YF-xtOw';
  const map = new mapboxgl.Map({
    container: 'map',
// Choose from Mapbox's core styles, or make your own style with Mapbox Studio
    style: 'mapbox://styles/mapbox/light-v11',
    // projection: 'winkelTripel',
    center: [31.9818479644837, 46.9625154],
    zoom: 8
  });

  const months = [
    'January',
    'February',
    'March',
    'April',
    'May',
    'June',
    'July',
    'August',
    'September',
    'October',
    'November',
    'December'
  ];

  function filterBy(month) {
    const filters = ['==', 'month', month];
    map.setFilter('targets-Mykolaiv', filters);
    // map.setFilter('earthquake-labels', filters);

// Set the label to the month
    document.getElementById('month').textContent = months[month];
  }

  map.on('load', () => {
//    ?format=geojson
//    &starttime=2022-06-01
//    &endtime=2022-12-31
//
// Here we're using d3 to help us make the ajax request but you can use
// Any request method (library or otherwise) you wish.
    d3.json(
            // 'https://docs.mapbox.com/mapbox-gl-js/assets/significant-earthquakes-2015.geojson',
            './data3_withScale.geojson',
            jsonCallback
    );
  });

  function jsonCallback(err, data) {
    if (err) {
      throw err;
    }

// Create a month property value based on time
// used to filter against.
    data.features = data.features.map((d) => {
      // d.properties.month = new Date(d.properties.time).getMonth();
      d.properties.month = new Date(d.properties.timestamp).getMonth();
      return d;
    });

    map.addSource('shelling', {
      'type': 'geojson',
      data: data
    });

    map.addLayer({
      'id': 'targets-Mykolaiv',
      'type': 'circle',
      'source': 'shelling',
      'paint': {
        'circle-color': [
          'interpolate',
          ['linear'],
          ['get', 'scale'],
          1,
          '#FCA107',
          2,
          '#fc6507',
          3,
          '#fc2407',
          5,
          '#7F3121'
        ],
        'circle-opacity': 0.75,
        'circle-radius': [
          'interpolate',
          ['linear'],
          ['get', 'scale'],
          3,
          8,
          10,
          20

        ]
      }
    });

    /*map.addLayer({
      'id': 'earthquake-labels',
      'type': 'symbol',
      'source': 'earthquakes',
      'layout': {
        'text-field': ['concat', ['to-string', ['get', 'mag']], 'm'],
        'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'],
        'text-size': 12
      },
      'paint': {
        'text-color': 'rgba(0,0,0,0.5)'
      }
    });*/
    /*
Add an event listener that runs
when a user clicks on the map element.
*/
    map.on('click', (event) => {
      // If the user clicked on one of your markers, get its information.
      const features = map.queryRenderedFeatures(event.point, {
        layers: ['targets-Mykolaiv'] // replace with your layer name
      });
      if (!features.length) {
        return;
      }
      const feature = features[0];
      /*
  Create a popup, specify its options
  and properties, and add it to the map.
  */
      const popup = new mapboxgl.Popup({ offset: [0, -15] })
              .setLngLat(feature.geometry.coordinates)
              .setHTML(
                      `\<h3>${feature.properties.sheet_name}</h3><p>${feature.properties.description}</p><p>${feature.properties.date}</p>`
              )
              .addTo(map);
    });


// Set filter to first month of the year
// 0 = January
    filterBy(7);

    document.getElementById('slider').addEventListener('input', (e) => {
      const month = parseInt(e.target.value, 10);
      filterBy(month);
    });
  }
</script>

</body>
</html>
